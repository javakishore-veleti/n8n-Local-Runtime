services:

  postgres:
    image: postgres:15
    container_name: local-n8n-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
      POSTGRES_DB: n8n
    volumes:
      - ${LOCAL_AI_DEPLOY}/postgres:/var/lib/postgresql/data
    ports:
      - "9432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: local-n8n-platform-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - ${LOCAL_AI_DEPLOY}/pgadmin:/var/lib/pgadmin
    ports:
      - "9505:80"
    depends_on:
      postgres:
        condition: service_healthy

  neo4j:
    image: neo4j:5
    container_name: local-n8n-platform-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes:
      - ${LOCAL_AI_DEPLOY}/neo4j:/data
      # Shared AI data lake (read/write)
      - ${LOCAL_AI_DATA}:/data/local-ai
    ports:
      - "9474:7474"
      - "9687:7687"

  mongodb:
    image: mongo:7
    container_name: local-n8n-platform-mongodb
    restart: unless-stopped
    volumes:
      - ${LOCAL_AI_DEPLOY}/mongodb:/data/db
      # Shared AI data lake (read/write)
      - ${LOCAL_AI_DATA}:/data/local-ai
    ports:
      - "9017:27017"

  prometheus:
    image: prom/prometheus
    container_name: local-n8n-platform-prometheus
    restart: unless-stopped
    volumes:
      - ${LOCAL_AI_DEPLOY}/prometheus:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9909:9090"

  grafana:
    image: grafana/grafana
    container_name: local-n8n-platform-grafana
    restart: unless-stopped
    volumes:
      - ${LOCAL_AI_DEPLOY}/grafana:/var/lib/grafana
    ports:
      - "9300:3000"

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: local-n8n-platform-jaeger
    restart: unless-stopped
    ports:
      - "9668:16686"
      - "9437:4317"
      - "9438:4318"

  # 🔹 N8N UI + AI Orchestration
  n8n:
    image: n8nio/n8n:latest
    container_name: local-n8n-platform-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n

      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: development
      GENERIC_TIMEZONE: UTC

      # Convention (documented, not required)
      AI_DATA_BASE_PATH: /data/local-ai/my_ai_profiles
    volumes:
      - ${LOCAL_AI_DEPLOY}/n8n:/home/node/.n8n
      # Shared AI data lake (read/write)
      - ${LOCAL_AI_DATA}:/data/local-ai
    ports:
      - "9567:5678"
