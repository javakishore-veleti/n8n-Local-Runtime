version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: local-n8n-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
      POSTGRES_DB: n8n
    volumes:
      - ${LOCAL_AI_DEPLOY}/postgres:/var/lib/postgresql/data
    ports:
      - "9432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: local-n8n-platform-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - ${LOCAL_AI_DEPLOY}/pgadmin:/var/lib/pgadmin
    ports:
      - "9505:80"
    depends_on:
      postgres:
        condition: service_healthy

  neo4j:
    image: neo4j:5
    container_name: local-n8n-platform-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes:
      - ${LOCAL_AI_DEPLOY}/neo4j:/data
      - ${LOCAL_AI_DATA}:/data/local-ai
    ports:
      - "9474:7474"
      - "9687:7687"

  mongodb:
    image: mongo:7
    container_name: local-n8n-platform-mongodb
    restart: unless-stopped
    volumes:
      - ${LOCAL_AI_DEPLOY}/mongodb:/data/db
      - ${LOCAL_AI_DATA}:/data/local-ai
    ports:
      - "9017:27017"

  redis:
    image: redis:7
    container_name: local-n8n-platform-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${LOCAL_AI_DEPLOY}/redis:/data
    ports:
      - "9637:6379"

  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: local-n8n-platform-qdrant
    restart: unless-stopped
    volumes:
      - ${LOCAL_AI_DEPLOY}/qdrant:/qdrant/storage
    ports:
      - "9633:6333"
      - "9634:6334"

  prometheus:
    image: prom/prometheus
    container_name: local-n8n-platform-prometheus
    restart: unless-stopped
    volumes:
      - ${LOCAL_AI_DEPLOY}/prometheus:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9909:9090"

  grafana:
    image: grafana/grafana
    container_name: local-n8n-platform-grafana
    restart: unless-stopped
    volumes:
      - ${LOCAL_AI_DEPLOY}/grafana:/var/lib/grafana
    ports:
      - "9300:3000"

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: local-n8n-platform-jaeger
    restart: unless-stopped
    ports:
      - "9668:16686"
      - "9437:4317"
      - "9438:4318"

  # 🔹 Execution Runtime (Python, Node, AWS CLI, etc.)
  data-analysis-stack:
    image: vavkkishoreusa/data-analysis-stack:latest
    container_name: local-data-analysis-runner
    platform: linux/amd64
    restart: unless-stopped
    environment:
      SERVER_MODE: "true"
      AI_DATA_BASE_PATH: /data/local-ai/my_profile_data
    volumes:
      - ${LOCAL_AI_DATA}:/data/local-ai
      - ./scripts:/workspace/scripts
    working_dir: /workspace

  # 🔹 n8n (Orchestrator)
  n8n:
    image: n8nio/n8n:latest
    container_name: local-n8n-platform-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=development
      - GENERIC_TIMEZONE=UTC
      - AI_DATA_BASE_PATH=/data/local-ai/my_profile_data
      - NODES_EXCLUDE=[]
    volumes:
      - ${LOCAL_AI_DEPLOY}/n8n:/home/node/.n8n
      - ${LOCAL_AI_DATA}:/data/local-ai
    ports:
      - "9567:5678"
